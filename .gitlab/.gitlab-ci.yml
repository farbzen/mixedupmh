stages:
  - build

build_dev:
  stage: build
  image: mcr.cloudsupplies.de/library/rust:1.86.0-bookworm
  needs: []
  interruptible: true
  script:
    - cp -r .build/askama.toml .
    - cp -r res/* .
    - cargo build --release
    - cp target/release/mumh .
  artifacts:
    name: "mumh_dev"
    when: always
    expire_in: "1 hour"
    paths:
      - "templates/"
      - "static/"
      - "json/"
      - "mumh"
  only:
    - dev
