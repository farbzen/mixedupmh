stages:
  - build

build_dev:
  stage: build 
  image: rust:1.86.0-bookworm
  needs: []
  before_script:
    - apt update
  script:
    - cp -r res/* .
    - cargo build --release
  artifacts:
    name: "mumh_dev"
    when: always
    expire_in: "1 hour"
    paths:
      - "templates/"
      - "static/"
      - "json/"
      - "target/release/mumh"
  only:
    - dev
