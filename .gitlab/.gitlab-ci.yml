stages:
  - build

build_dev:
  stage: build 
  image: rust:1.86.0-bookworm
  needs: []
  before_script:
    - apt update
    - apt install -y zip
  script:
    - cp -r res/* .
    - cargo build --release
    - cp target/release/mumh .
    - zip -r mumh_dev.zip static/ json/ templates/ mumh
  artifacts:
    when: always
    expire_in: "1 hour"
    paths:
      - "mumh_dev.zip"
  only:
    - dev
