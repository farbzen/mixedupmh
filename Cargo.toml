[package]
name = "mumh"
version = "0.5.1"
edition = "2024"

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
askama = "0.16.0"
axum = "0.8.9"
chrono = "0.4.45"
displaydoc = "0.2.6"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = "2.11.5"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-cookies = "0.11.0"
tower-http = { version = "0.7.0", features = ["full"] }
tower-layer = "0.3.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
