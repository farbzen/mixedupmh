<div class="size-[40rem] text-4xl xl:size-96 xl:text-lg content-end p-3 mt-6 transition-all bg-contain bg-no-repeat bg-center"
     style="background-image: url('/assets/images/monsters/{{ temper }}_{{ monster.name }}.webp')">
    <div class="bg-gradient-to-r from-black to-transparent bg-opacity-80 rounded-lg p-2">
        <p class="whitespace-nowrap drop-shadow-md">{{ lang.get(monster.name) }}</p>
        <p class="whitespace-nowrap drop-shadow-md">
            {% if capture %}
                {{ lang.get("capture") }}
            {% else %}
                {{ lang.get("kill") }}
            {% endif %}
        </p>
    </div>
</div>
