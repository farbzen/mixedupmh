{% extends "layouts/main.html" %}
{% block page %}
    <div class="flex justify-center" hx-boost="true">
        <div id="monster"
             hx-get="/_components/monster"
             hx-swap="innerHTML swap:.6s settle:.8s"
             hx-trigger="click from:#rollAll throttle:4s">
            <div class="size-[40rem] text-4xl xl:size-96 xl:text-lg content-end p-3 mt-6 transition-all bg-contain bg-no-repeat bg-center"
                 style='background-image: url("/assets/images/monsters/{{ temper }}_{{ monster }}.webp")'>
                <div class="bg-gradient-to-r from-black to-transparent bg-opacity-80 rounded-lg p-2">
                    <p class="whitespace-nowrap drop-shadow-md">{{ lang.get(monster) }}</p>
                    <p class="whitespace-nowrap drop-shadow-md">
                        {% if capture %}
                            {{ lang.get("capture") }}
                        {% else %}
                            {{ lang.get("kill") }}
                        {% endif %}
                    </p>
                </div>
            </div>
        </div>
    </div>
    <div x-data="{ hunterCount: {{ hunter_count }} }">
        <div class="w-full text-3xl xl:text-base my-5 flex justify-center">
            <select class="bg-slate-950 rounded-lg shadow-lg w-min py-2 px-4 mx-2"
                    x-model.number="hunterCount"
                    name="count"
                    hx-get="/_actions/hunter/count"
                    hx-trigger="change"
                    hx-swap="none">
                {% for hunter_number in 1..5 %}
                    <option value="{{ hunter_number }}"
                            {% if hunter_count == hunter_number %}selected{% endif %}>
                        {{ hunter_number }} {{ lang.get("players") }}
                    </option>
                {% endfor %}
            </select>
            <button class="bg-slate-950 opacity-70 hover:opacity-90 active:opacity-100 rounded-xl p-2 mx-2"
                    id="rollAll">
                <img class="size-9" src="/assets/images/reload.webp" />
            </button>
        </div>
        <div class="flex justify-center">
            <div class="w-full flex flex-wrap justify-center">
                {% for hunter_number in 1..5 %}
                    <div id="hunter_{{ hunter_number }}"
                         hx-get="/_components/hunter/{{ hunter_number }}"
                         hx-swap="innerHTML swap:{{ 0.6 + hunter_number as f64 * 0.6 }}s settle:.8s"
                         hx-trigger="click from:#rollAll delay:{{ 0.1 + hunter_number as f64 * 0.1 }}s throttle:4s"
                         x-show="hunterCount >= {{ hunter_number }}">
                        <div class="size-96 text-3xl content-end p-3 m-5 transition-all bg-contain bg-no-repeat bg-center xl:size-60 xl:text-lg"
                             style='background-image: url("/assets/images/weapons/{{ weapons[hunter_number - 1] }}.webp")'>
                            <div class="bg-gradient-to-r from-black to-transparent bg-opacity-80 rounded-lg p-2"
                                 hx-get="/_actions/hunter/rename"
                                 hx-trigger="change"
                                 hx-swap="none"
                                 hx-include="this"
                                 hx-vals='{"number": "{{ hunter_number }}"}'>
                                <input type="text"
                                       name="name"
                                       class="bg-transparent h-8 w-full drop-shadow-md"
                                       value="{{ hunter_names[hunter_number - 1] }}" />
                                <p class="whitespace-nowrap drop-shadow-md">{{ lang.get(weapons[hunter_number - 1]) }}</p>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>
{% endblock %}
