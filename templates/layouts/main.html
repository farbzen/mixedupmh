<!DOCTYPE html>
<html class="size-full transition-colors overflow-x-hidden">
    <head>
        <title>{{ lang.get("title") }}</title>
        <meta charset="UTF-8" />
        <meta name="description"
              content="A Monster Hunter randomizer, written in Rust." />
        <meta name="keywords"
              content="Monster, Hunter, MH, MHW, Wilds, Randomizer, Roulette, Mixed, Up" />
        <meta name="author" content="Fabian Meier" />
        <meta name="robots" content="noindex,nofollow" />
        <link rel="stylesheet" href="/assets/css/main.css" />
        <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico" />
        {% include "components/scripts.html" %}
    </head>
    <body class="bg-slate-950 text-slate-50 size-full transition-colors">
        <div class="min-h-[95vh] bg-slate-900 content-center">
            {% block page %}{% endblock %}
        </div>
        <div class="content-center">{% include "components/footer.html" %}</div>
    </body>
</html>
